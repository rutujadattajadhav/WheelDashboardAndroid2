plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.railway.wheeldashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.railway.wheeldashboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            res {
                srcDirs 'src\\main\\res', 'src\\main\\res\\layout\\axlerejection'
            }
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.mpandroidchart
    implementation libs.retrofit2.retrofit
    implementation libs.converter.gson
    // Paging Library for Pagination
    implementation libs.paging.runtime
    // RecyclerView for displaying data in table format
    implementation libs.recyclerview
    // OkHttp Logging Interceptor (For debugging API calls)
    implementation libs.logging.interceptor
    // Kotlin Coroutines
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    //implementation libs.recyclerview.v121
    //implementation libs.paging.runtime.v311
   // implementation libs.kotlinx.coroutines.core.v171
    implementation libs.lifecycle.runtime.ktx
    //implementation libs.lifecycle.livedata.ktx.v261
}